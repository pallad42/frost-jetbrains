<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Frost: a white snowflake over a pane of frosted glass, Powder pastels blurred behind it -->
  <defs>
    <clipPath id="tile"><rect x="3" y="3" width="34" height="34" rx="10"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.0"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9"/></filter>
    <!-- frosted glass: milky, a little more at the top -->
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient>
    <!-- light caught diagonally in the glass -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0.25" stop-color="#fff" stop-opacity="0"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.3"/><stop offset="0.58" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <!-- thick glass edge: bright at the top and the bottom -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.2" stop-color="#fff" stop-opacity="0.2"/><stop offset="0.8" stop-color="#fff" stop-opacity="0.1"/><stop offset="1" stop-color="#fff" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/></linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <g filter="url(#blur)">
    <rect x="0" y="0" width="40" height="40" fill="#3a3550"/>
    <path d="M-2 20 C8 10 14 30 24 18 C29 12 34 4 42 6 V-2 H-2 Z" fill="#c3b4e8"/>
    <path d="M-2 4 C6 2 12 8 10 16 C8 22 0 24 -2 26 Z" fill="#d895b4"/>
    <path d="M42 12 C32 16 28 26 34 42 H42 Z" fill="#8fb3c9"/>
    <path d="M-2 30 C10 22 22 36 42 26 V42 H-2 Z" fill="#2d2a3e"/>
    <path d="M6 42 C10 32 20 30 28 42 Z" fill="#d895b4" opacity="0.8"/>
    </g>
    <rect x="3" y="3" width="34" height="34" fill="url(#frost)"/>
    <rect x="3" y="3" width="34" height="34" fill="url(#band)"/>
    <!-- the edge of the glass bends light: a soft bright rim inside -->
    <rect x="4.5" y="4.5" width="31" height="31" rx="8" fill="none" stroke="url(#inner)" stroke-width="2.5" filter="url(#soft)"/>
  </g>

  <!-- snowflake: white, floating above the glass -->
  <g transform="translate(0 0.8)" filter="url(#soft)">
    <path d="M20.00 20.00 L20.00 28.50 M18.44 25.39 L20.00 23.82 L21.56 25.39 M18.68 27.70 L20.00 26.38 L21.32 27.70 M20.00 20.00 L12.64 24.25 M14.55 21.34 L16.69 21.91 L16.12 24.05 M12.67 22.70 L14.48 23.19 L14.00 24.99 M20.00 20.00 L12.64 15.75 M16.12 15.95 L16.69 18.09 L14.55 18.66 M14.00 15.01 L14.48 16.81 L12.67 17.30 M20.00 20.00 L20.00 11.50 M21.56 14.61 L20.00 16.18 L18.44 14.61 M21.32 12.30 L20.00 13.62 L18.68 12.30 M20.00 20.00 L27.36 15.75 M25.45 18.66 L23.31 18.09 L23.88 15.95 M27.33 17.30 L25.52 16.81 L26.00 15.01 M20.00 20.00 L27.36 24.25 M23.88 24.05 L23.31 21.91 L25.45 21.34 M26.00 24.99 L25.52 23.19 L27.33 22.70" stroke="#1f1f24" stroke-opacity="0.25" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M20.00 20.00 L20.00 28.50 M18.44 25.39 L20.00 23.82 L21.56 25.39 M18.68 27.70 L20.00 26.38 L21.32 27.70 M20.00 20.00 L12.64 24.25 M14.55 21.34 L16.69 21.91 L16.12 24.05 M12.67 22.70 L14.48 23.19 L14.00 24.99 M20.00 20.00 L12.64 15.75 M16.12 15.95 L16.69 18.09 L14.55 18.66 M14.00 15.01 L14.48 16.81 L12.67 17.30 M20.00 20.00 L20.00 11.50 M21.56 14.61 L20.00 16.18 L18.44 14.61 M21.32 12.30 L20.00 13.62 L18.68 12.30 M20.00 20.00 L27.36 15.75 M25.45 18.66 L23.31 18.09 L23.88 15.95 M27.33 17.30 L25.52 16.81 L26.00 15.01 M20.00 20.00 L27.36 24.25 M23.88 24.05 L23.31 21.91 L25.45 21.34 M26.00 24.99 L25.52 23.19 L27.33 22.70" stroke="#f5f5f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- light glass frame, with a highlight just inside it -->
  <rect x="3.5" y="3.5" width="33" height="33" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="4.4" y="4.4" width="31.2" height="31.2" rx="8.6" fill="none" stroke="url(#edge)" stroke-width="0.8"/>
</svg>
