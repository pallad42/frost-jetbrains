<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <!-- "Desktop" colours behind the glass, already blurred: soft radial blobs -->
    <radialGradient id="blobBlue" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3FA9FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#3FA9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTeal" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <!-- Frosted pane: milky fill, brighter at the top-left -->
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Specular rim: bright top-left edge fading to the bottom-right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="3" y="3" width="34" height="34" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="3" y="3" width="34" height="34" fill="url(#base)"/>
    <rect x="3" y="3" width="34" height="34" fill="url(#blobBlue)"/>
    <rect x="3" y="3" width="34" height="34" fill="url(#blobViolet)"/>
    <rect x="3" y="3" width="34" height="34" fill="url(#blobTeal)"/>
    <rect x="3" y="3" width="34" height="34" fill="url(#frost)"/>
    <!-- glossy highlight across the top -->
    <path d="M3 3 H37 V15 C28 19 14 19 3 13 Z" fill="url(#sheen)"/>
  </g>
  <rect x="3.6" y="3.6" width="32.8" height="32.8" rx="9.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>

  <!-- Snowflake -->
  <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="20.00" y1="29.20" x2="20.00" y2="10.80"/>
    <line x1="20.00" y1="14.40" x2="21.67" y2="12.41"/>
    <line x1="20.00" y1="14.40" x2="18.33" y2="12.41"/>
    <line x1="27.97" y1="24.60" x2="12.03" y2="15.40"/>
    <line x1="15.15" y1="17.20" x2="14.26" y2="14.76"/>
    <line x1="15.15" y1="17.20" x2="12.59" y2="17.65"/>
    <line x1="27.97" y1="15.40" x2="12.03" y2="24.60"/>
    <line x1="15.15" y1="22.80" x2="12.59" y2="22.35"/>
    <line x1="15.15" y1="22.80" x2="14.26" y2="25.24"/>
    <line x1="20.00" y1="25.60" x2="18.33" y2="27.59"/>
    <line x1="20.00" y1="25.60" x2="21.67" y2="27.59"/>
    <line x1="24.85" y1="22.80" x2="25.74" y2="25.24"/>
    <line x1="24.85" y1="22.80" x2="27.41" y2="22.35"/>
    <line x1="24.85" y1="17.20" x2="27.41" y2="17.65"/>
    <line x1="24.85" y1="17.20" x2="25.74" y2="14.76"/>
  </g>
</svg>
