# Local IntelliJ IDEA used both to compile against and to run the sandbox IDE (runIde), when it exists
ideaPath=/Applications/IntelliJ IDEA.app
# Otherwise (CI) this IntelliJ IDEA version is downloaded instead
platformVersion=2026.2.3

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true

# Config dir of your everyday IntelliJ - target of ./gradlew installPlugin.
# Defaults to ~/Library/Application Support/JetBrains/IntelliJIdea2026.2; override with ideaConfigDir=...
