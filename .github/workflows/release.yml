# Publishing a GitHub release (tag vX.Y.Z matching the version in build.gradle.kts): build and verify the plugin,
# attach the zip to the release and, once the PUBLISH_TOKEN secret is set, upload it to JetBrains Marketplace.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The IDE, its plugins and the Plugin Verifier need more room than the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the plugin version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          if [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match version $version (expected v$version)"
            exit 1
          fi
      - name: Build and verify
        run: ./gradlew buildPlugin verifyPlugin
      - name: Attach the plugin zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin
